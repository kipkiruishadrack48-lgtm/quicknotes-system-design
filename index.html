
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Create, view and manage your notes.</p>
    </header>

    <main>
        <section>
            <h2>Load Notes</h2>

            <button id="load-btn" type="button">
                Load notes
            </button>

            <p id="status" aria-live="polite">
                Click Load notes to view your notes.
            </p>
        </section>

        <section>
            <h2>Create a New Note</h2>

            <form id="note-form">
                <label for="title-input">Note Title</label>
                <input
                    type="text"
                    id="title-input"
                    maxlength="100"
                    required
                    placeholder="Enter note title"
                >

                <label for="body-input">Note Body</label>
                <textarea
                    id="body-input"
                    rows="5"
                    placeholder="Write your note here"
                ></textarea>

                <button id="submit-btn" type="submit">
                    Create Note
                </button>
            </form>
        </section>

        <section>
            <h2>My Notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>

</body>
</html>
